<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ajouter un patient - Medilabo Solutions</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<header>
    <h1>Medilabo Solutions</h1>
</header>

<main class="container">

    <div class="card">

        <h2>Ajouter un patient</h2>

        <form th:action="@{/patients/add}"
              th:object="${patient}"
              method="post">

            <div class="form-grid">

                <div class="form-group">
                    <label for="lastName">Nom</label>

                    <input type="text"
                           id="lastName"
                           th:field="*{lastName}">

                    <span class="error"
                          th:if="${#fields.hasErrors('lastName')}"
                          th:errors="*{lastName}"></span>
                </div>

                <div class="form-group">
                    <label for="firstName">Prénom</label>

                    <input type="text"
                           id="firstName"
                           th:field="*{firstName}">

                    <span class="error"
                          th:if="${#fields.hasErrors('firstName')}"
                          th:errors="*{firstName}"></span>
                </div>

                <div class="form-group">
                    <label for="birth">Date de naissance</label>

                    <input type="date"
                           id="birth"
                           th:field="*{birth}">

                    <span class="error"
                          th:if="${#fields.hasErrors('birth')}"
                          th:errors="*{birth}"></span>
                </div>

                <div class="form-group">
                    <label for="gender">Genre</label>

                    <input type="text"
                           id="gender"
                           th:field="*{gender}">

                    <span class="error"
                          th:if="${#fields.hasErrors('gender')}"
                          th:errors="*{gender}"></span>
                </div>

                <div class="form-group">
                    <label for="address">Adresse</label>

                    <input type="text"
                           id="address"
                           th:field="*{address}">
                </div>

                <div class="form-group">
                    <label for="phone">Téléphone</label>

                    <input type="text"
                           id="phone"
                           th:field="*{phone}">
                </div>

            </div>

            <button class="btn" type="submit">
                Ajouter le patient
            </button>

        </form>

        <a class="back-link" th:href="@{/patients}">
            ← Retour à la liste des patients
        </a>

    </div>

</main>

</body>
</html>
