<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Modifier un patient</title>
</head>
<body>

<h1>Modifier un patient</h1>

<form th:action="@{/patients/edit/{id}(id=${patient.id})}"
      th:object="${patient}"
      method="post">

    <div>
        <label for="firstName">Prénom :</label>
        <input type="text" id="firstName" th:field="*{firstName}">
        <span th:if="${#fields.hasErrors('firstName')}"
              th:errors="*{firstName}"></span>
    </div>

    <div>
        <label for="lastName">Nom :</label>
        <input type="text" id="lastName" th:field="*{lastName}">
        <span th:if="${#fields.hasErrors('lastName')}"
              th:errors="*{lastName}"></span>
    </div>

    <div>
        <label for="birth">Date de naissance :</label>
        <input type="date" id="birth" th:field="*{birth}">
        <span th:if="${#fields.hasErrors('birth')}"
              th:errors="*{birth}"></span>
    </div>

    <div>
        <label for="gender">Genre :</label>
        <input type="text" id="gender" th:field="*{gender}">
        <span th:if="${#fields.hasErrors('gender')}"
              th:errors="*{gender}"></span>
    </div>

    <div>
        <label for="address">Adresse :</label>
        <input type="text" id="address" th:field="*{address}">
    </div>

    <div>
        <label for="phone">Téléphone :</label>
        <input type="text" id="phone" th:field="*{phone}">
    </div>

    <button type="submit">Modifier</button>

</form>

<h2>Notes du patient</h2>

<div th:each="note : ${notes}">

    <form th:action="@{/patients/{patientId}/notes/{noteId}/edit(
              patientId=${patient.id},
              noteId=${note.id}
          )}"
          method="post">

        <div>
            <textarea name="note"
                      rows="5"
                      cols="50"
                      th:text="${note.note}"></textarea>
        </div>

        <button type="submit">Modifier la note</button>

    </form>

</div>


<h3>Ajouter une note</h3>

<form th:action="@{/patients/{id}/notes(id=${patient.id})}"
      th:object="${newNote}"
      method="post">

    <div>
        <label for="note">Note :</label>
        <textarea id="note"
                  th:field="*{note}"
                  rows="5"
                  cols="50"></textarea>
    </div>

    <button type="submit">Ajouter la note</button>

</form>


<a th:href="@{/patients}">Retour à la liste des patients</a>

</body>
</html>
