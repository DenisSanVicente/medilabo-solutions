spring.application.name=gateway-service
server.port=8080

spring.cloud.gateway.server.webmvc.routes[0].id=patient-service
spring.cloud.gateway.server.webmvc.routes[0].uri=${PATIENT_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/patients/**

spring.cloud.gateway.server.webmvc.routes[1].id=note-service
spring.cloud.gateway.server.webmvc.routes[1].uri=${NOTE_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/notes/**