services:

  # ==========================================
  # BASE DE DONNÉES MYSQL
  # ==========================================

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: medilabo_patient
      MYSQL_USER: medilabo_user
      MYSQL_PASSWORD: rootroot
      MYSQL_ROOT_PASSWORD: rootroot
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootroot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s

  # ==========================================
  # BASE DE DONNÉES MONGODB
  # ==========================================

  mongodb:
    image: mongo:7
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ==========================================
  # PATIENT SERVICE
  # ==========================================

  patient-service:
    build:
      context: ./patient-service
    environment:
      DB_URL: jdbc:mysql://mysql:3306/medilabo_patient
      DB_USERNAME: medilabo_user
      DB_PASSWORD: rootroot
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy

  # ==========================================
  # NOTE SERVICE
  # ==========================================

  note-service:
    build:
      context: ./note-service
    environment:
      MONGODB_URI: mongodb://mongodb:27017/medilabo_notes
    ports:
      - "8083:8083"
    depends_on:
      mongodb:
        condition: service_healthy

  # ==========================================
  # ASSESSMENT SERVICE
  # ==========================================

  assessment-service:
    build:
      context: ./assessment-service
    environment:
      PATIENT_SERVICE_URL: http://patient-service:8082
      NOTE_SERVICE_URL: http://note-service:8083
      SERVICE_USERNAME: user
      SERVICE_PASSWORD: password
    ports:
      - "8084:8084"
    depends_on:
      - patient-service
      - note-service

  # ==========================================
  # GATEWAY SERVICE
  # ==========================================

  gateway-service:
    build:
      context: ./gateway-service
    environment:
      PATIENT_SERVICE_URL: http://patient-service:8082
      NOTE_SERVICE_URL: http://note-service:8083
      ASSESSMENT_SERVICE_URL: http://assessment-service:8084

      PATIENT_SERVICE_USERNAME: user
      PATIENT_SERVICE_PASSWORD: password

      NOTE_SERVICE_USERNAME: user
      NOTE_SERVICE_PASSWORD: password

      ASSESSMENT_SERVICE_USERNAME: user
      ASSESSMENT_SERVICE_PASSWORD: password

      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8080:8080"
    depends_on:
      - patient-service
      - note-service
      - assessment-service

  # ==========================================
  # FRONT SERVICE
  # ==========================================

  front-service:
    build:
      context: ./front-service
    environment:
      GATEWAY_URL: http://gateway-service:8080
    ports:
      - "8081:8081"
    depends_on:
      - gateway-service

# ==========================================
# VOLUMES PERSISTANTS
# ==========================================

volumes:
  mysql-data:
  mongo-data: