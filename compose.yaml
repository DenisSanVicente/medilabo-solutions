services:

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: medilabo_patient
      MYSQL_USER: medilabo_user
      MYSQL_PASSWORD: rootroot
      MYSQL_ROOT_PASSWORD: rootroot
    ports:
      - "3307:3306"
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootroot" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s

  patient-service:
    build:
      context: ./patient-service
    environment:
      DB_URL: jdbc:mysql://mysql:3306/medilabo_patient
      DB_USERNAME: medilabo_user
      DB_PASSWORD: rootroot
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy

  gateway-service:
    build:
      context: ./gateway-service
    environment:
      PATIENT_SERVICE_URL: http://patient-service:8082
    ports:
      - "8080:8080"
    depends_on:
      - patient-service

  front-service:
    build:
      context: ./front-service
    environment:
      GATEWAY_URL: http://gateway-service:8080
    ports:
      - "8081:8081"
    depends_on:
      - gateway-service